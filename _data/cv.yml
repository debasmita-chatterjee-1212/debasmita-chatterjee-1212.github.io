    Experience:
      - company: Sorbonne University
        position: Research Assistant
        start_date: 2024
        end_date: 2026
        summary: "Perception Robustness of LiDAR-Based Autonomous Mapping on Dynamic Terrain"
        highlights:
          - "Designed and conducted a factorial experimental study of how LiDAR sensor degradation affects dynamic-point removal and mapping performance across varying scene dynamics."
          - "Reproduced and benchmarked existing dynamic-point removal and LiDAR odometry methods on real-world datasets, simulating dynamic scenes based on real-world dataset characteristics."
          - "Built a reproducible experimental pipeline and evaluated performance using dynamic and static accuracy, error and computational runtime."
          - "Analysed results with statistical modelling to study degradation effects, interactions and the influence of scene dynamics on mapping robustness."

    Projects:
      - name: Surgical Simulator for Phantom OMNI Haptics Device
        summary: "Supervisor: Dr. Cheruvu Siva Kumar, Mechanical Engineering Dept., IIT Kharagpur"
        start_date: 2022
        end_date: 2023
        highlights:
          - "Developed a physics-based surgical simulation framework incorporating linear-elastic tensor-mass modelling, volumetric anatomical meshes and explicit numerical integration of deformable tissues"
          - "Implemented rigid anatomical contact, proxy-based soft-tissue palpation and fracture-energy-based surface incision models for surgical instrument interaction"
          - "Integrated haptic devices for force-feedback, collision detection, and surgical tool interaction"
          - "Conducted analytical benchmark experiments and mesh refinement studies, achieving displacement errors as low as 1.23% in uniaxial compression and identifying numerical limitations in bending and contact modelling"
      
      - name: Vision-Based UAV Pursuit Control
        summary: "Supervisor: Dr. Martin Barczyk, Mechanical Engineering Department, University of Alberta"
        start_date: 2022
        end_date: 2022
        highlights:
          - "Developed modular PID position and yaw control in C++ and ROS for Parrot UAVs, with quaternion-to-Euler conversion and coordinate transformations of Vicon motion capture pose data, interactive gain tuning and CSV logging."
          - "Developed a detection and tracking control system using MAVROS package for autonomously detecting the target UAV in motion using another flying UAV on which the system is onboard ; simulated the whole system on jMAVsim successfully"
          - "Mounted and calibrated cameras on the tracker UAV, and manually annotated keypoints and labels on its frames of the target UAV using LabelMe"
          - "Implemented neural networks to convert 2D to 3D bounding boxes in real time for improved vision, control and target tracking of the target UAV at varying ranges and environments"

      - name: Cardiac Cine-MRI Analysis and Classification
        summary: "Supervisor: Dr. Arnab Palit, WMG, University of Warwick"
        start_date: 2022
        end_date: 2022
        highlights:
          - "Built a MATLAB pipeline for 2D cardiac cine-MRI, covering DICOM import, preprocessing and left ventricular (LV) segmentation tracked across the cardiac cycle."
          - "Segmented the LV from manually initialised contours propagated across frames with cyclic tracking and checked frame by frame."
          - "Extracted 20 LV features per patient, including end-diastolic and end-systolic area, fractional area change, temporal area-curve features and myocardial strain values during a full cardiac cycle"
          - "Trained classifiers for healthy-versus-MI classification with patient-level validation resulting in 89.4% held-out test accuracy followed by integration into one automated workflow that generates patient-level reports."

      - name: Advanced Drone Research Group
        summary: "Supervisor: Prof. Aditya Bandopadhyay, Department of Mechanical Engineering, IIT Kharagpur"
        start_date: 2020
        end_date: 2021
        highlights:
          - "Head of the OEDR team and member of the Localization and Mapping team."
          - "Conducted a literature review on object detection and classification algorithms and UAV flight control systems."
          - "Implemented the Fast Geometric Avoidance (FGA) algorithm with object classification and visual SLAM."
          - "Ran flight tests with multiple sensor configurations to evaluate localization performance."

      - name: Risk-Aware Highway Trajectory Planner
        summary: "Undergraduate project, IIT Kharagpur"
        start_date: 2021
        end_date: 2021
        highlights:
          - "Built a Python simulation of autonomous highway driving with a three-lane environment, six surrounding vehicles and four candidate manoeuvres"
          - "Estimated collision risk by Monte Carlo sampling of stochastic traffic trajectories and selected manoeuvres by a weighted cost of risk, proximity and comfort."
          - "Across 200 simulated scenarios (80,000 rollouts), reduced mean estimated collision probability by 40.4% against lane keeping in challenging traffic (74.83% to 44.59%)."

      - name: Autonomous Hexacopter Design for Indoor Warehouse Operations
        summary: "Flipkart GRiD 2.0 Robotics Challenge (semi-finalist)"
        start_date: 2020
        end_date: 2020
        highlights:
          - "Designed a hexacopter for autonomous indoor warehouse operations including inventory management, logistics and package inspection."
          - "Performed structural and stability analysis using SolidWorks and Autodesk Inventor Nastran, plus aerodynamic and payload calculations using eCalc."
          - "Designed autonomous navigation modules: SOFT-SLAM stereo visual SLAM with Extended Kalman Filter fusion of IMU and altimeter, occupancy-grid obstacle avoidance, gate navigation and PID trajectory tracking."
          - "Developed a vision-based self-adjusting gripper with OpenCV real-time object measurement using Canny edge detection, erosion and dilation driving two linear actuators."

