cv:
  name: Debasmita Chatterjee
  label: Robotics Researcher
  email: debuchatt212@gmail.com
  location: India
  image: ""
  summary: Mechanical engineer turned robotics researcher working on perception, mapping and control for autonomous vehicles and UAVs, seeking a PhD in autonomous vehicles and motion planning.

  social_networks:
    - network: GitHub
      username: debasmita-chatterjee-1212
    - network: LinkedIn
      username: debasmita-chatterjee-805366191

  sections:
    Education:
      - institution: Indian Institute of Technology, Kharagpur
        url: https://www.iitkgp.ac.in/
        area: Mechanical Engineering
        studyType: Bachelor's and Master's
        start_date: 2018
        end_date: 2023
        score: "CGPA 8.35/10"
        courses: "Kinematics of Machines, Fluid Mechanics, Heat Transfer, Systems and Controls, Mechanisms and Robot Kinematics, Knowledge Based Systems in Engineering, Applied Thermo Fluids, Computational Fluid Dynamics, Applied Elasticity, Embedded Sensing Actuation and Interfacing System, Principles of Automotive and Dynamic Controls, Data Analytics, Probability and Stochastic Processes"


    Experience:
      - company: ISIR Lab, Sorbonne University
        position: Research Assistant
        start_date: 2024
        end_date: 2026
        summary: "Perception Robustness of LiDAR-Based Autonomous Mapping on Dynamic Terrain"
        highlights:
          - "Designed and conducted a factorial experimental study of how LiDAR sensor degradation affects dynamic-point removal and mapping performance across varying scene dynamics."
          - "Reproduced and benchmarked existing dynamic-point removal and LiDAR odometry methods on real-world datasets, simulating dynamic scenes based on real-world dataset characteristics."
          - "Built a reproducible experimental pipeline and evaluated performance using dynamic and static accuracy, error and computational runtime."
          - "Analysed results with statistical modelling to study degradation effects, interactions and the influence of scene dynamics on mapping robustness."

    Projects:
      - name: Surgical Simulator for Phantom OMNI Haptics Device
        summary: "Supervisor: Dr. Cheruvu Siva Kumar, Mechanical Engineering Dept., IIT Kharagpur"
        start_date: 2022
        end_date: 2023
        highlights:
          - "Developed a volume-rendered 3D model of human anatomical structures using Spin Mesh Converter and Unity 3D."
          - "Integrated haptic devices for force feedback, collision detection and surgical tool interaction."
          - "Implemented linear elastic and tensor-mass models to emulate tissue deformation, cutting and tearing, updating the surface in real time."
          - "Designed multi-angle visualization and haptic rendering on the mesh for anatomical exploration in clinical training."

      - name: Vision-Based UAV Pursuit Control
        summary: "Supervisor: Dr. Martin Barczyk, Mechanical Engineering Department, University of Alberta"
        start_date: 2022
        end_date: 2022
        highlights:
          - "Built a program to obtain and process the state of the target UAV from a Vicon motion capture setup."
          - "Developed a detection and tracking control system using MAVROS so one flying UAV autonomously detects and follows another, and simulated the full system on jMAVsim."
          - "Manually annotated keypoints and labels on tracker-UAV frames using labelme."
          - "Implemented neural networks to convert 2D to 3D bounding boxes in real time for improved vision, control and target tracking at varying ranges and environments."

      - name: Myocardial Strain Analysis of the Healthy and Diseased Heart
        summary: "Supervisor: Dr. Arnab Palit, WMG, University of Warwick"
        start_date: 2022
        end_date: 2022
        highlights:
          - "Estimated myocardial strain over a full cardiac cycle from cardiac MRI data of several patients using Segment."
          - "Built a MATLAB model using diffeomorphic elastic image registration to compute Green-Lagrange strain tensors across the myocardial wall."
          - "Developed an automated myocardial segmentation pipeline for more accurate strain analysis."

      - name: Advanced Drone Research Group
        summary: "Supervisor: Prof. Aditya Bandopadhyay, Department of Mechanical Engineering, IIT Kharagpur"
        start_date: 2020
        end_date: 2021
        highlights:
          - "Head of the OEDR team and member of the Localization and Mapping team."
          - "Conducted a literature review on object detection and classification algorithms and UAV flight control systems."
          - "Implemented the Fast Geometric Avoidance (FGA) algorithm with object classification and visual SLAM."
          - "Ran flight tests with multiple sensor configurations to evaluate localization performance."

      - name: Autonomous Lane-Keeping System
        summary: "ATDC, IIT Kharagpur"
        start_date: 2021
        end_date: 2021
        highlights:
          - "Implemented lane detection and PID feedback control, achieving under 0.15 m RMS lateral error in variable weather conditions."
          - "Introduced a safety-assist module with 98% accuracy in deviation alerts under environmental perturbations."

      - name: Autonomous Hexacopter Design for Indoor Warehouse Operations
        summary: "Flipkart GRiD 2.0 Robotics Challenge (semi-finalist)"
        start_date: 2020
        end_date: 2020
        highlights:
          - "Designed a hexacopter for autonomous indoor warehouse operations including inventory management, logistics and package inspection."
          - "Performed structural and stability analysis using SolidWorks and Autodesk Inventor Nastran, plus aerodynamic and payload calculations using eCalc."
          - "Designed navigation modules using SOFT-SLAM for localisation, OctoMap for mapping and Integral Backstepping control for smooth take-off and landing."
          - "Developed a self-adjusting object-gripping mechanism with OpenCV-based real-time object measurement, Canny edge detection, erosion and dilation."

